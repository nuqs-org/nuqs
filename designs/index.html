<!-- Local prototype for running scans and reviewing their findings. -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuqs · Scan workspace</title><link rel="stylesheet" href="workbench.css"><script defer src="workbench.js"></script></head>
<body><header><div class="bar"><strong class="brand">nuqs</strong><nav aria-label="Workspace"><button id="scanTab" aria-current="page">Scan</button><button id="checksTab">Checks</button></nav><button id="theme">Light theme</button></div></header>
<main><section id="scanPage"><h1>Scan workspace</h1>
<form id="scanForm"><fieldset id="settings"><label for="target">Target</label>
<div class="controls"><input id="target" required placeholder="127.0.0.1" aria-describedby="scope"><button class="primary">Run scan</button></div>
<small id="scope">Enter localhost or an IPv4 address or range within 127.0.0.0/8.</small>
<details><summary>Scan options</summary><div class="options">
<label>Ports<input id="ports" placeholder="Top 1000 ports"></label><label>Check timeout<input id="timeout" value="30s" required></label>
<label>Concurrent checks<input id="workers" type="number" min="1" max="128" value="10" required></label>
<label class="option"><input type="checkbox" id="skipPing">Skip host discovery <small>(-Pn)</small></label>
<label class="option"><input type="checkbox" id="force">Allow over 1024 addresses <small>(--force)</small></label></div></details></fieldset></form>
<p id="status" role="status"></p><button id="stop" hidden>Stop scan</button>
<section id="results" hidden><div class="heading"><h2>Scan report</h2><button id="download">Download JSON</button></div>
<p id="metadata"></p><div id="counts"></div><div class="toolbar"><label>Severity <select id="filter"><option value="">All severities</option></select></label>
<button id="rawToggle" aria-expanded="false">Show raw JSON</button></div><pre id="raw" hidden></pre><div id="findings"></div><div id="errors"></div></section>
</section><section id="checksPage" hidden><h1>Available checks</h1><div id="catalog" aria-live="polite"></div></section></main></body></html>
