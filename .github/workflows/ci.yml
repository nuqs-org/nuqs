# Tests, lint, fuzzing, the real Nmap test and builds, on every push and pull request.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays, runs the macOS smoke test
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Tests, race detector and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Unit tests and coverage
        run: make test

  lint:
    name: Lint (and doc comments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  fuzz:
    name: Fuzz ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/target, fn: FuzzParse }
          - { pkg: ./internal/nmap, fn: FuzzParse }
          - { pkg: ./internal/version, fn: FuzzCompare }
          - { pkg: ./internal/sshprobe, fn: FuzzReadPacket }
          - { pkg: ./checks/mongodbnoauth, fn: FuzzReply }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fuzz for 30 seconds
        run: go test ${{ matrix.pkg }} -run='^$' -fuzz=${{ matrix.fn }} -fuzztime=30s -fuzzminimizetime=0

  integration:
    name: Integration (real Nmap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Run
        run: make integration

  lab:
    name: Lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap
      - run: make lab
        env:
          LAB_OUT: lab-report.json
      # When the report changes, download this, check it, and commit it as lab/expected-report.json.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lab-report
          path: lab-report.json
          if-no-files-found: ignore

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make build VERSION=${GITHUB_SHA::7}
      - name: Smoke test
        run: |
          ./nuqs version
          ./nuqs checks
          ./nuqs scan -- -oN && exit 1 || echo "bad target rejected, good"

  # Building for other systems works from Linux, so this always gets a machine.
  cross:
    name: Builds for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./...

  # Tests the Windows Makefile path (nuqs.exe and PowerShell helpers).
  windows:
    name: Smoke test on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Keep LF line endings for gofmt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Smoke test
        run: |
          .\nuqs.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\nuqs.exe checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\nuqs.exe scan -- -oN
          if ($LASTEXITCODE -eq 0) { throw "bad target was not rejected" }
          Write-Host "bad target rejected, good"
          exit 0
      - name: Formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit tests and coverage
        run: make test
      - name: Clean
        run: make clean

  # GitHub's Mac machines are often busy, so the real Mac run is weekly or by hand.
  macos:
    name: Smoke test on a real Mac
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
      - run: |
          ./nuqs version
          ./nuqs checks
          ./nuqs scan -- -oN && exit 1 || echo "bad target rejected, good"
      - run: make test

  vulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
