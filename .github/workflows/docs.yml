# Builds the docs website on every pull request and publishes it from the default branch.

name: Docs

# Builds the website on every PR (so broken docs fail the PR) and publishes
# it to GitHub Pages on every push to the default branch (main or master).
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# One run at a time per branch. A new push to a PR cancels its older run,
# but publishing from master is never cancelled halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (same script we use locally, strict so broken links fail)
        run: ./scripts/docs.sh build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
